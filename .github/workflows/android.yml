# Builds the Android app on GitHub's machines, so nothing has to be installed
# on Windows.
#
#   Push to main        -> a test APK in the run's Artifacts section
#   Push a tag v1.2.3   -> the same, plus a GitHub Release with the APK attached
#
# With the signing secrets set (see RELEASING.md) every build is signed with
# your one release key, so each new APK installs over the last one. Without
# them, builds fall back to throwaway debug keys and release tags are refused.

name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release on a tag

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # The Android SDK is preinstalled on the runner; only the JDK needs picking.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Copy the web app into place
        # The web build is just static files, so this is a copy rather than a build step.
        run: |
          mkdir -p www
          cp -r web/* www/

      - name: Generate the Android project if it is not committed
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Work out the version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="dev-${GITHUB_SHA::7}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Always rising, which is all Android asks of a versionCode.
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version $name (code $GITHUB_RUN_NUMBER)"

      - name: Unpack the signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key set up, so this is a debug build. It will not install over a previous build. See RELEASING.md."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.signed == 'true' && format('{0}/release.p12', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then task=assembleRelease; else task=assembleDebug; fi
          ./gradlew "$task" --no-daemon \
            -PversionCode="${{ steps.ver.outputs.code }}" \
            -PversionName="${{ steps.ver.outputs.name }}"

      - name: Name the APK after the version
        run: |
          mkdir -p out
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            src=android/app/build/outputs/apk/release/app-release.apk
          else
            src=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$src" "out/cyanotype-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: cyanotype-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.key.outputs.signed }}" != "true" ]; then
            echo "::error::Refusing to publish a release signed with a throwaway key. Set up signing first (RELEASING.md)."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" out/*.apk \
            --title "Cyanotype $GITHUB_REF_NAME" \
            --generate-notes
